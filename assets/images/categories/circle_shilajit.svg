<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="catDarkBg2" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#dca13d" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRim2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9a7122" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="20%" stop-color="#553a22"/>
      <stop offset="45%" stop-color="#1f150c"/>
      <stop offset="80%" stop-color="#3d2815"/>
      <stop offset="100%" stop-color="#150e08"/>
    </linearGradient>
    <linearGradient id="goldLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7122"/>
      <stop offset="30%" stop-color="#dca13d"/>
      <stop offset="50%" stop-color="#fdf3cf"/>
      <stop offset="75%" stop-color="#dca13d"/>
      <stop offset="100%" stop-color="#7c5815"/>
    </linearGradient>
    <filter id="shadowCircle2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="240" fill="url(#catDarkBg2)"/>
  <circle cx="250" cy="250" r="239" fill="none" stroke="url(#goldRim2)" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="240" fill="url(#goldGlow2)"/>

  <!-- Shilajit Jar & Golden Honey Dipper / Resin Spoon -->
  <g filter="url(#shadowCircle2)">
    <ellipse cx="250" cy="385" rx="90" ry="14" fill="#000000" opacity="0.9"/>
    
    <!-- Amber Miron Glass Jar -->
    <rect x="175" y="210" width="150" height="165" rx="18" fill="url(#jarGlass)" stroke="#4a3522" stroke-width="1"/>
    
    <!-- Jar Glass Specular Sheen -->
    <rect x="185" y="220" width="16" height="145" rx="4" fill="#ffffff" opacity="0.15"/>
    <rect x="300" y="220" width="8" height="145" rx="3" fill="#ffffff" opacity="0.08"/>

    <!-- Matte Black & Gold Foil Label -->
    <rect x="195" y="245" width="110" height="95" rx="4" fill="#0d0d0d" stroke="#dca13d" stroke-width="0.75"/>
    <text x="250" y="268" font-family="'Cinzel', serif" font-size="8" font-weight="700" fill="#dca13d" letter-spacing="2" text-anchor="middle">ZAFFRAN</text>
    <line x1="215" y1="275" x2="285" y2="275" stroke="#dca13d" stroke-width="0.5" opacity="0.6"/>
    <text x="250" y="295" font-family="'Playfair Display', serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Shilajit</text>
    <text x="250" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" fill="#dca13d" letter-spacing="1" text-anchor="middle">HIMALAYAN RESIN</text>
    <text x="250" y="326" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#a0a0a0" text-anchor="middle">100% PURE GOLD GRADE</text>

    <!-- Heavy Gold Brushed Metal Lid -->
    <rect x="170" y="180" width="160" height="32" rx="4" fill="url(#goldLid)" stroke="#dca13d" stroke-width="0.5"/>
    <!-- Lid Ridges -->
    <line x1="170" y1="196" x2="330" y2="196" stroke="#ffffff" stroke-width="0.75" opacity="0.5"/>
  </g>
</svg>
