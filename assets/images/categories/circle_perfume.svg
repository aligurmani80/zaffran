<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Inner Circle Gradient -->
    <radialGradient id="catDarkBg1" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="goldGlow1" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#dca13d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9a7122" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Glass Bottle Shading -->
    <linearGradient id="bottleGlassMini" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="85%" stop-color="#444444"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
    <linearGradient id="amberJuiceMini" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c76c"/>
      <stop offset="50%" stop-color="#dca13d"/>
      <stop offset="100%" stop-color="#6e4206"/>
    </linearGradient>
    <filter id="shadowCircle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Black Circular Background with Subtle Border -->
  <circle cx="250" cy="250" r="240" fill="url(#catDarkBg1)"/>
  <circle cx="250" cy="250" r="239" fill="none" stroke="url(#goldRim)" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="240" fill="url(#goldGlow1)"/>

  <!-- Centered Luxury Perfume Bottle -->
  <g filter="url(#shadowCircle)">
    <!-- Base Shadow -->
    <ellipse cx="250" cy="385" rx="85" ry="14" fill="#000000" opacity="0.9"/>
    <ellipse cx="250" cy="382" rx="55" ry="8" fill="#dca13d" opacity="0.3"/>

    <!-- Glass Flacon -->
    <rect x="180" y="195" width="140" height="180" rx="14" fill="url(#bottleGlassMini)" stroke="#555555" stroke-width="1"/>
    <!-- Amber Juice -->
    <rect x="195" y="225" width="110" height="140" rx="8" fill="url(#amberJuiceMini)"/>
    <rect x="200" y="230" width="18" height="130" rx="4" fill="#ffffff" opacity="0.25"/>

    <!-- Label -->
    <rect x="210" y="260" width="80" height="65" rx="3" fill="#0d0d0d" stroke="#dca13d" stroke-width="0.75"/>
    <text x="250" y="280" font-family="'Cinzel', serif" font-size="8" font-weight="700" fill="#dca13d" letter-spacing="2" text-anchor="middle">ZAFFRAN</text>
    <line x1="225" y1="288" x2="275" y2="288" stroke="#dca13d" stroke-width="0.5" opacity="0.6"/>
    <text x="250" y="302" font-family="'Playfair Display', serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Perfume</text>
    <text x="250" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#a0a0a0" letter-spacing="1" text-anchor="middle">EXTRAIT</text>

    <!-- Collar & Onyx Cap -->
    <rect x="230" y="178" width="40" height="18" rx="2" fill="#dca13d" stroke="#fdf3cf" stroke-width="0.5"/>
    <rect x="220" y="125" width="60" height="55" rx="6" fill="#181818" stroke="#444444" stroke-width="0.75"/>
    <rect x="220" y="172" width="60" height="6" rx="1" fill="#dca13d"/>
    <circle cx="250" cy="150" r="10" fill="#0d0d0d" stroke="#dca13d" stroke-width="0.75"/>
    <text x="250" y="154" font-family="'Cinzel', serif" font-size="8" font-weight="700" fill="#dca13d" text-anchor="middle">Z</text>
  </g>
</svg>
