<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="zaffranGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff9f0" stop-opacity="1"/>
      <stop offset="60%" stop-color="#fdf0e0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f2dcbe" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Crystal Clear Glass Bowl Gradient -->
    <linearGradient id="crystalBowl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#faf2ea" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#e2cfbf" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ba9c84" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Deep Ruby Saffron Filament Gradients -->
    <linearGradient id="saffronThreadDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a0c0c"/>
      <stop offset="50%" stop-color="#b81616"/>
      <stop offset="100%" stop-color="#e8451c"/>
    </linearGradient>

    <linearGradient id="saffronThreadGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c11818"/>
      <stop offset="80%" stop-color="#e53b12"/>
      <stop offset="100%" stop-color="#f99b1d"/>
    </linearGradient>

    <!-- Wooden / Brass Box Tray Gradient -->
    <linearGradient id="vintageTray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d4233"/>
      <stop offset="50%" stop-color="#1b2a20"/>
      <stop offset="100%" stop-color="#0f1812"/>
    </linearGradient>

    <linearGradient id="trayRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4d48a"/>
      <stop offset="50%" stop-color="#dbab4a"/>
      <stop offset="100%" stop-color="#8a6119"/>
    </linearGradient>

    <filter id="softZaffranShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3c1e13" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="800" height="650" rx="24" fill="url(#zaffranGlow)"/>

  <!-- Botanical Saffron Flower Petal Geometry in Background -->
  <g opacity="0.35" transform="translate(400, 320)">
    <circle cx="0" cy="0" r="230" fill="none" stroke="#2d4e3e" stroke-width="1.5" stroke-dasharray="6 8"/>
    <ellipse cx="0" cy="-140" rx="26" ry="70" fill="#a89bb6" opacity="0.3"/>
    <ellipse cx="120" cy="-70" rx="26" ry="70" fill="#a89bb6" opacity="0.3" transform="rotate(60 120 -70)"/>
    <ellipse cx="120" cy="70" rx="26" ry="70" fill="#a89bb6" opacity="0.3" transform="rotate(120 120 70)"/>
    <ellipse cx="0" cy="140" rx="26" ry="70" fill="#a89bb6" opacity="0.3"/>
    <ellipse cx="-120" cy="70" rx="26" ry="70" fill="#a89bb6" opacity="0.3" transform="rotate(240 -120 70)"/>
    <ellipse cx="-120" cy="-70" rx="26" ry="70" fill="#a89bb6" opacity="0.3" transform="rotate(300 -120 -70)"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="545" rx="230" ry="26" fill="#3d281a" opacity="0.16"/>
  <ellipse cx="400" cy="540" rx="160" ry="16" fill="#20130b" opacity="0.22"/>

  <!-- Lacquered Octagonal Presentation Box / Plinth -->
  <g filter="url(#softZaffranShadow)">
    <!-- Base Plate -->
    <path d="M 230 460 L 290 520 L 510 520 L 570 460 L 540 400 L 260 400 Z" fill="url(#vintageTray)" stroke="url(#trayRim)" stroke-width="2.5"/>
    
    <!-- Top Display Surface -->
    <ellipse cx="400" cy="445" rx="195" ry="58" fill="#17241c" stroke="url(#trayRim)" stroke-width="1.5"/>

    <!-- Gold Crest Inlay in Wooden Plinth -->
    <ellipse cx="400" cy="445" rx="175" ry="50" fill="none" stroke="#dbab4a" stroke-width="1" stroke-dasharray="5 7" opacity="0.6"/>

    <!-- Heritage Saffron Filaments Mound (Imperial Super Negin) -->
    <!-- Dense vibrant red filament heap -->
    <ellipse cx="400" cy="425" rx="125" ry="40" fill="#750a0a"/>
    <ellipse cx="400" cy="415" rx="100" ry="32" fill="#9c1010"/>

    <!-- Hand-drawn Crimson Filaments (Super Negin Saffron Stigmas) -->
    <g stroke-linecap="round">
      <!-- Cluster 1: Left Flank -->
      <path d="M 330 410 Q 310 370 290 350 Q 285 345 280 348" stroke="url(#saffronThreadGold)" stroke-width="4.5" fill="none"/>
      <path d="M 345 405 Q 325 365 310 330 Q 305 320 295 322" stroke="url(#saffronThreadDark)" stroke-width="4" fill="none"/>
      <path d="M 360 415 Q 340 350 325 315 Q 320 300 310 302" stroke="url(#saffronThreadGold)" stroke-width="4.2" fill="none"/>

      <!-- Cluster 2: Center Crown -->
      <path d="M 380 400 Q 370 330 365 280 Q 363 260 355 255" stroke="url(#saffronThreadGold)" stroke-width="4.8" fill="none"/>
      <path d="M 395 395 Q 395 320 392 260 Q 390 240 380 235" stroke="url(#saffronThreadDark)" stroke-width="5" fill="none"/>
      <path d="M 405 398 Q 410 325 415 270 Q 418 250 428 245" stroke="url(#saffronThreadGold)" stroke-width="4.8" fill="none"/>
      <path d="M 420 405 Q 430 335 440 285 Q 445 265 455 260" stroke="url(#saffronThreadDark)" stroke-width="4.5" fill="none"/>

      <!-- Cluster 3: Right Flank -->
      <path d="M 440 410 Q 465 355 490 320 Q 500 310 512 312" stroke="url(#saffronThreadGold)" stroke-width="4.2" fill="none"/>
      <path d="M 460 418 Q 485 370 515 340 Q 525 330 535 335" stroke="url(#saffronThreadDark)" stroke-width="4" fill="none"/>
      <path d="M 430 425 Q 450 380 475 350" stroke="url(#saffronThreadGold)" stroke-width="3.5" fill="none"/>

      <!-- Front Cascade Strands -->
      <path d="M 370 425 Q 350 440 330 460 Q 320 470 315 480" stroke="url(#saffronThreadDark)" stroke-width="4" fill="none"/>
      <path d="M 390 435 Q 390 460 385 485 Q 382 495 375 502" stroke="url(#saffronThreadGold)" stroke-width="4.2" fill="none"/>
      <path d="M 425 430 Q 445 455 460 475 Q 470 488 480 495" stroke="url(#saffronThreadDark)" stroke-width="4" fill="none"/>
      
      <!-- Stigma Tips (Flared Trumpet ends distinctive of authentic saffron) -->
      <circle cx="280" cy="348" r="3" fill="#e53b12"/>
      <circle cx="355" cy="255" r="3.2" fill="#f99b1d"/>
      <circle cx="380" cy="235" r="3.5" fill="#f99b1d"/>
      <circle cx="428" cy="245" r="3.2" fill="#e53b12"/>
      <circle cx="512" cy="312" r="3" fill="#f99b1d"/>
      <circle cx="535" cy="335" r="2.8" fill="#e53b12"/>
    </g>

    <!-- Glass Dome Cloche Cover (Resting gently tilted behind) -->
    <path d="M 280 410 C 280 200, 520 200, 520 410" fill="url(#crystalBowl)" opacity="0.35" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="400" cy="410" rx="120" ry="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <circle cx="400" cy="210" r="16" fill="url(#crystalBowl)" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Subtle Premium Badge on Tray -->
    <rect x="330" y="478" width="140" height="28" rx="6" fill="#0f1912" stroke="url(#trayRim)" stroke-width="1"/>
    <text x="400" y="496" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="2" font-weight="600" fill="#f4d48a" text-anchor="middle">SUPER NEGIN GRADE</text>
  </g>
</svg>
