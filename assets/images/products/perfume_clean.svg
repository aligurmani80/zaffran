<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Clean Product Card -->
    <radialGradient id="prodCardBg1" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </radialGradient>
    <radialGradient id="perfumeAuraCard" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#dca13d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcfcfc" stop-opacity="0.95"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#f4ece2" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#dfcfbe" stop-opacity="0.45"/>
      <stop offset="90%" stop-color="#cca788" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8c6c4e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d69e" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#dca13d" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#94531a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8832a"/>
      <stop offset="35%" stop-color="#fde3a2"/>
      <stop offset="70%" stop-color="#dca13d"/>
      <stop offset="100%" stop-color="#8a5e18"/>
    </linearGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#141414" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#prodCardBg1)"/>
  <rect width="900" height="900" fill="url(#perfumeAuraCard)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="450" cy="740" rx="260" ry="32" fill="#241b14" opacity="0.14" filter="url(#cardShadow)"/>
  <ellipse cx="450" cy="735" rx="180" ry="18" fill="#140f0c" opacity="0.22"/>

  <!-- Bottle Group -->
  <g filter="url(#cardShadow)">
    <rect x="295" y="270" width="310" height="420" rx="28" fill="url(#cardGlass)" stroke="#e8d8c8" stroke-width="2"/>
    <rect x="325" y="325" width="250" height="335" rx="16" fill="url(#cardLiquid)"/>
    <rect x="335" y="335" width="40" height="305" rx="8" fill="#ffffff" opacity="0.28"/>

    <!-- Minimal Modern Label -->
    <rect x="360" y="420" width="180" height="150" rx="6" fill="#0d0d0d" stroke="#dca13d" stroke-width="1"/>
    <rect x="366" y="426" width="168" height="138" rx="3" fill="none" stroke="#dca13d" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.7"/>
    <text x="450" y="456" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#dca13d" letter-spacing="3" text-anchor="middle">ZAFFRAN</text>
    <line x1="395" y1="468" x2="505" y2="468" stroke="#dca13d" stroke-width="0.7" opacity="0.5"/>
    <text x="450" y="495" font-family="'Playfair Display', serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Artisanal Oud</text>
    <text x="450" y="516" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#b0b0b0" letter-spacing="2" text-anchor="middle">EXTRAIT DE PARFUM</text>
    <text x="450" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#dca13d" letter-spacing="1.5" text-anchor="middle">50 ML / 1.7 FL.OZ</text>

    <!-- Collar & Cap -->
    <rect x="415" y="238" width="70" height="34" rx="4" fill="url(#cardGold)"/>
    <rect x="395" y="110" width="110" height="130" rx="10" fill="#141414" stroke="#333333" stroke-width="1"/>
    <rect x="395" y="226" width="110" height="12" rx="2" fill="url(#cardGold)"/>
    <circle cx="450" cy="168" r="20" fill="#0d0d0d" stroke="#dca13d" stroke-width="1"/>
    <text x="450" y="174" font-family="'Cinzel', serif" font-size="15" font-weight="700" fill="#dca13d" text-anchor="middle">Z</text>
  </g>
</svg>
