<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="perfumeGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff8f2" stop-opacity="1"/>
      <stop offset="60%" stop-color="#faeee3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eedcd0" stop-opacity="0.4"/>
    </radialGradient>
    
    <!-- Bottle Body Glass Gradient -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfbf7" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#f5e8d8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#dfc5aa" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#caa788" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8c6c4e" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Liquid Fragrance Gradient -->
    <linearGradient id="fragranceLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4c88a" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#df9a4e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a4581f" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Forest & Sage Cap Gradient -->
    <linearGradient id="emeraldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a49"/>
      <stop offset="45%" stop-color="#1f3729"/>
      <stop offset="70%" stop-color="#15271d"/>
      <stop offset="100%" stop-color="#2d4638"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3d797"/>
      <stop offset="40%" stop-color="#fdf4da"/>
      <stop offset="70%" stop-color="#e0b25e"/>
      <stop offset="100%" stop-color="#ad7b2c"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a1f18" flood-opacity="0.18"/>
    </filter>
    <filter id="pedestalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#3e2c1c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="800" height="650" rx="24" fill="url(#perfumeGlow)"/>

  <!-- Geometric Decorative Ring -->
  <circle cx="400" cy="340" r="230" fill="none" stroke="#2d4e3e" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25"/>
  <circle cx="400" cy="340" r="260" fill="none" stroke="#d4934d" stroke-width="1" opacity="0.3"/>

  <!-- Realistic Pedestal Shadow -->
  <ellipse cx="400" cy="550" rx="220" ry="28" fill="#584232" opacity="0.12" filter="url(#pedestalShadow)"/>
  <ellipse cx="400" cy="542" rx="150" ry="16" fill="#32241b" opacity="0.2"/>

  <!-- Bottle Structure Group -->
  <g filter="url(#softShadow)">
    <!-- Main Glass Flacon -->
    <rect x="290" y="230" width="220" height="290" rx="22" fill="url(#glassBody)" stroke="#eedbcc" stroke-width="1.5"/>

    <!-- Inner Fragrance Juice Chamber -->
    <rect x="312" y="270" width="176" height="230" rx="14" fill="url(#fragranceLiquid)"/>

    <!-- Liquid Surface Meniscus & Sparkle -->
    <path d="M 312 276 Q 400 270 488 276" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Glass Highlights & Specular Reflections -->
    <path d="M 302 245 L 302 505" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M 314 250 L 314 495" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 498 245 L 498 505" stroke="#483321" stroke-width="3" stroke-linecap="round" opacity="0.2"/>

    <!-- Label Plaque (Warm Cream & Forest Green) -->
    <rect x="330" y="325" width="140" height="135" rx="8" fill="#fffdfa" stroke="url(#goldTrim)" stroke-width="1.5"/>
    <rect x="334" y="329" width="132" height="127" rx="6" fill="none" stroke="#2d4e3e" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Label Typography -->
    <text x="400" y="362" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="600" letter-spacing="4" fill="#6d5843" text-anchor="middle">ZAFFRAN</text>
    <line x1="365" y1="373" x2="435" y2="373" stroke="#d4934d" stroke-width="1"/>
    <text x="400" y="398" font-family="'Playfair Display', Georgia, serif" font-size="16" font-style="italic" font-weight="700" fill="#1f3729" text-anchor="middle">Artisanal Oud</text>
    <text x="400" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="2.5" fill="#8d745e" text-anchor="middle">EXTRAIT DE PARFUM</text>
    <text x="400" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" letter-spacing="1" fill="#a8927e" text-anchor="middle">50 ML e 1.7 FL. OZ.</text>

    <!-- Bottle Neck -->
    <rect x="368" y="195" width="64" height="38" rx="4" fill="url(#glassBody)"/>
    <!-- Gold Neck Collar Rings -->
    <rect x="362" y="186" width="76" height="12" rx="3" fill="url(#goldTrim)"/>
    <rect x="360" y="172" width="80" height="15" rx="3" fill="url(#goldTrim)"/>

    <!-- Sculpted Cap (Deep Forest Green with Gold Crest) -->
    <path d="M 350 172 C 350 145, 365 110, 400 110 C 435 110, 450 145, 450 172 Z" fill="url(#emeraldCap)" stroke="url(#goldTrim)" stroke-width="1.5"/>
    <!-- Cap Highlight -->
    <path d="M 368 155 Q 400 125 432 155" stroke="#689379" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Floating Botanical Accent (Saffron filament hint & soft spark) -->
  <g opacity="0.85">
    <path d="M 525 210 Q 560 230 550 265 Q 540 295 565 320" fill="none" stroke="#d44a28" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 545 220 Q 575 250 560 280" fill="none" stroke="#e66832" stroke-width="2" stroke-linecap="round"/>
    <circle cx="566" cy="322" r="3.5" fill="#e66832"/>
  </g>
</svg>
