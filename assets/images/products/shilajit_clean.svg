<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <radialGradient id="prodCardBg2" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f0ece1"/>
    </radialGradient>
    <radialGradient id="shilajitAuraCard" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#dca13d" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jarGlassLarge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#221b14"/>
      <stop offset="20%" stop-color="#553a22"/>
      <stop offset="45%" stop-color="#18110b"/>
      <stop offset="75%" stop-color="#442a15"/>
      <stop offset="100%" stop-color="#120c07"/>
    </linearGradient>
    <linearGradient id="goldLidLarge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7122"/>
      <stop offset="25%" stop-color="#dca13d"/>
      <stop offset="50%" stop-color="#fdf3cf"/>
      <stop offset="75%" stop-color="#dca13d"/>
      <stop offset="100%" stop-color="#7c5815"/>
    </linearGradient>
    <filter id="cardShadow2" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#141414" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#prodCardBg2)"/>
  <rect width="900" height="900" fill="url(#shilajitAuraCard)"/>

  <ellipse cx="450" cy="740" rx="270" ry="32" fill="#241b14" opacity="0.14" filter="url(#cardShadow2)"/>
  <ellipse cx="450" cy="735" rx="190" ry="18" fill="#140f0c" opacity="0.22"/>

  <!-- Shilajit Jar -->
  <g filter="url(#cardShadow2)">
    <rect x="290" y="340" width="320" height="340" rx="36" fill="url(#jarGlassLarge)" stroke="#4a3522" stroke-width="2"/>
    <rect x="310" y="360" width="34" height="300" rx="8" fill="#ffffff" opacity="0.14"/>
    <rect x="560" y="360" width="16" height="300" rx="6" fill="#ffffff" opacity="0.08"/>

    <!-- Matte Black & Gold Label -->
    <rect x="330" y="415" width="240" height="195" rx="8" fill="#0d0d0d" stroke="#dca13d" stroke-width="1.2"/>
    <rect x="338" y="423" width="224" height="179" rx="4" fill="none" stroke="#dca13d" stroke-width="0.5" stroke-dasharray="4 2" opacity="0.6"/>
    <text x="450" y="458" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#dca13d" letter-spacing="3" text-anchor="middle">ZAFFRAN</text>
    <line x1="380" y1="472" x2="520" y2="472" stroke="#dca13d" stroke-width="0.75" opacity="0.5"/>
    <text x="450" y="512" font-family="'Playfair Display', serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Pure Shilajit</text>
    <text x="450" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#dca13d" letter-spacing="2" text-anchor="middle">HIMALAYAN GOLD RESIN</text>
    <text x="450" y="572" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#a0a0a0" text-anchor="middle">100% PURE &amp; LAB-TESTED • 30G</text>

    <!-- Heavy Gold Brushed Cap -->
    <rect x="280" y="275" width="340" height="70" rx="8" fill="url(#goldLidLarge)" stroke="#dca13d" stroke-width="1"/>
    <line x1="280" y1="310" x2="620" y2="310" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
