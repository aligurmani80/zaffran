<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <radialGradient id="founderBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="60%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="founderGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#dca13d" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="founderFrameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dca13d" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c5815" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Deep Dark Editorial Card -->
  <rect width="800" height="650" rx="16" fill="url(#founderBg)"/>
  <rect width="800" height="650" rx="16" fill="url(#founderGlow)"/>
  <rect x="20" y="20" width="760" height="610" rx="12" fill="none" stroke="url(#founderFrameGold)" stroke-width="1" opacity="0.6"/>

  <!-- Subtle Studio Technical Grid Lines (Zevyon-inspired) -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="20" y1="200" x2="780" y2="200"/>
    <line x1="20" y1="450" x2="780" y2="450"/>
    <line x1="250" y1="20" x2="250" y2="630"/>
    <line x1="550" y1="20" x2="550" y2="630"/>
  </g>

  <!-- Crest & Brand Seal in Center -->
  <g transform="translate(400, 260)">
    <!-- Outer concentric rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#dca13d" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>
    <circle cx="0" cy="0" r="115" fill="#141414" stroke="#dca13d" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.2"/>

    <!-- Emblem Symbol -->
    <text x="0" y="20" font-family="'Cinzel', Georgia, serif" font-size="70" font-weight="700" fill="#dca13d" text-anchor="middle">Z</text>
  </g>

  <!-- Atmospheric Labeling / Botanical Atelier Caption -->
  <text x="400" y="445" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="4" text-anchor="middle">ZAFFRAN ATELIER</text>
  <line x1="320" y1="465" x2="480" y2="465" stroke="#dca13d" stroke-width="1" opacity="0.7"/>
  <text x="400" y="495" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#dca13d" letter-spacing="3" text-anchor="middle">BOTANICAL HERITAGE &amp; ARTISANAL CRAFT</text>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#888888" letter-spacing="1" text-anchor="middle">ESTABLISHED IN PUNJAB • HARVEST PROVENANCE</text>
</svg>
